name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.architecture }}

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build standalone EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name AutoShutdowner app.py

      - name: Rename build
        shell: pwsh
        run: Move-Item "dist/AutoShutdowner.exe" "dist/AutoShutdowner-${{ matrix.architecture }}.exe"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoShutdowner-${{ matrix.architecture }}
          path: dist/AutoShutdowner-${{ matrix.architecture }}.exe
          if-no-files-found: error
